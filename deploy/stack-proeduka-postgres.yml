# Portainer / Swarm — Stack com Postgres embutido na mesma rede interna.
# Substitui o Postgres externo (204.168.229.104) por um serviço `postgres` na overlay.
# ⚠️ Contém segredos em claro. NÃO incluir em repositório público / partilhas.
#
# Subir / atualizar:
#   docker stack deploy -c deploy/stack-proeduka-postgres.yml proeduka
#   (o nome da stack fica à escolha; usado como prefixo dos serviços/rede/volumes.)
#
# Migração a partir do Postgres externo:
#   1) Faça dump:  pg_dump -h 204.168.229.104 -U postgres -d proeduka > backup.sql
#   2) Deploy desta stack; 3) Copie para dentro do container: docker cp backup.sql $(docker ps -q -f name=proeduka_postgres):/backup.sql
#   4) Restaure:  docker exec -i $(docker ps -q -f name=proeduka_postgres) psql -U postgres -d proeduka < backup.sql
#   5) Apague o Postgres externo e ajuste DNS/firewall.
#
version: "3.7"

services:
  postgres:
    image: postgres:16-alpine
    networks:
      - stack_net
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "343klvnlvnslvnl5kn"
      POSTGRES_DB: "proeduka"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proeduka"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  proeduka:
    image: ghcr.io/dev-codero/proedukaportal:latest
    networks:
      - stack_net
      - network_public
    environment:
      DATABASE_URL: "postgresql://postgres:343klvnlvnslvnl5kn@postgres:5432/proeduka"
      SESSION_SECRET: "vK9xP2Lm8Qa7Nz4Uw1Hy6Rs3Df8Tc5Ab"
      AUTH_INSTANCE_ID: ""
      PROFILES_NAME_COLUMN: "nome"

      B2_APPLICATION_KEY_ID: "0055ec88b202ce10000000004"
      B2_APPLICATION_KEY: "K005xpkzaB+soD0OCCrYw3WN9hCltRI"
      B2_BUCKET_NAME: "proeduka"
      B2_S3_ENDPOINT: "https://s3.us-east-005.backblazeb2.com"
      B2_REGION: "us-east-005"

      CRON_SECRET: ""
      ENABLE_INTERNAL_CRON: "true"

      # Igual ao `deploy/stack.env` (produção). O bundle do cliente já vem compilado neste URL no build da imagem.
      NEXT_PUBLIC_APP_URL: "https://portalcursos.proeduka.com.br"
      NEXT_PUBLIC_ALUNOS_TABLE: "proeduka_alunos"
      NEXT_PUBLIC_BRAND_LOGO_URL: ""
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=1
        - traefik.http.routers.proeduka.rule=Host(`portalcursos.proeduka.com.br`)
        - traefik.http.routers.proeduka.entrypoints=websecure
        - traefik.http.routers.proeduka.priority=1
        - traefik.http.routers.proeduka.tls.certresolver=letsencryptresolver
        - traefik.http.routers.proeduka.service=proeduka
        - traefik.http.services.proeduka.loadbalancer.server.port=3000
        - traefik.http.services.proeduka.loadbalancer.passHostHeader=true

networks:
  stack_net:
    driver: overlay
    attachable: true
  network_public:
    name: network_public
    external: true

volumes:
  postgres_data:
    driver: local
