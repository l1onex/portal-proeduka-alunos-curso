# CI/CD — Next.js 16 (Node 22): ESLint + next build + imagem Docker (GHCR)
#
# Secrets (Settings → Actions):
#   NEXT_PUBLIC_APP_URL     — HTTPS público real do portal (ex.: https://portalcursos.proeduka.com.br)
# Opcional:
#   NEXT_PUBLIC_ALUNOS_TABLE — tabela em public.* (default proeduka_alunos)
#
# Paridade local: deploy/build.sh | deploy/build.ps1
# Secrets ausentes na PR fork: placeholders só para CI passar — não use imagem assim em prod.

name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://example.org' }}
      NEXT_PUBLIC_ALUNOS_TABLE: ${{ secrets.NEXT_PUBLIC_ALUNOS_TABLE || 'proeduka_alunos' }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Next.js build (standalone)
        run: npm run build

  docker:
    needs: lint-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://example.org' }}
      NEXT_PUBLIC_ALUNOS_TABLE: ${{ secrets.NEXT_PUBLIC_ALUNOS_TABLE || 'proeduka_alunos' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build args (sanitized)
        run: |
          echo "NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}"
          echo "NEXT_PUBLIC_ALUNOS_TABLE=${NEXT_PUBLIC_ALUNOS_TABLE}"
          tbl="${NEXT_PUBLIC_ALUNOS_TABLE:-proeduka_alunos}"
          echo "Dockerfile recebe também NEXT_PUBLIC_SUPABASE_ALUNOS_TABLE=${tbl}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase for GHCR)
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_ALUNOS_TABLE=${{ env.NEXT_PUBLIC_ALUNOS_TABLE }}
